name: Send emails daily

on:
  workflow_dispatch:
  schedule:
    - cron: "30 0 * * 1-5"   # Beijing 08:30, cs.RO + cs.SY
    - cron: "30 4 * * 1-5"   # Beijing 12:30, cs.LG
    - cron: "30 10 * * 1-5"  # Beijing 18:30, cs.CV

jobs:
  calculate-and-send:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          repository: ${{ vars.REPOSITORY }}
          ref: ${{ vars.REF }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7

      - name: Run batch
        env:
          ZOTERO_ID: ${{ secrets.ZOTERO_ID }}
          ZOTERO_KEY: ${{ secrets.ZOTERO_KEY }}
          SENDER: ${{ secrets.SENDER }}
          RECEIVER: ${{ secrets.RECEIVER }}
          SENDER_PASSWORD: ${{ secrets.SENDER_PASSWORD }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_API_BASE: ${{ secrets.OPENAI_API_BASE }}
          CUSTOM_CONFIG: ${{ vars.CUSTOM_CONFIG }}
        run: |
          printf "%b\n" "$CUSTOM_CONFIG" > config/custom.yaml
          echo "Use custom config: "
          cat config/custom.yaml

          if [ "${{ github.event.schedule }}" = "30 0 * * 1-5" ]; then
            uv run src/zotero_arxiv_daily/main.py \
              'source.arxiv.category=[cs.RO,cs.SY]' \
              executor.max_paper_num=30 \
              source.arxiv.max_fetch_paper_num=200

          elif [ "${{ github.event.schedule }}" = "30 4 * * 1-5" ]; then
            uv run src/zotero_arxiv_daily/main.py \
              'source.arxiv.category=[cs.LG]' \
              executor.max_paper_num=10 \
              source.arxiv.max_fetch_paper_num=100

          elif [ "${{ github.event.schedule }}" = "30 10 * * 1-5" ]; then
            uv run src/zotero_arxiv_daily/main.py \
              'source.arxiv.category=[cs.CV]' \
              executor.max_paper_num=10 \
              source.arxiv.max_fetch_paper_num=100

          else
            uv run src/zotero_arxiv_daily/main.py \
              'source.arxiv.category=[cs.RO,cs.SY]' \
              executor.max_paper_num=30 \
              source.arxiv.max_fetch_paper_num=200
          fi
